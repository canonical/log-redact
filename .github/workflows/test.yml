name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Install package and smoke-test the CLI
        run: |
          python3 -m pip install --user .
          echo "server 192.168.1.1 email test@example.com" > /tmp/smoke.txt
          python3 -m redact /tmp/smoke.txt --stdout | grep -q "REDACTED-IP" && echo "smoke test OK"
